name: PV ROI Tracker
version: "0.28.0"
slug: pv_roi_tracker
description: >-
  Tracks the ROI of a residential PV solar system.
  Uses live HA sensors for ongoing monthly tracking and scrapes RCEm prices from PSE.
  Publishes ROI sensors via MQTT discovery.
url: "https://github.com/miczu71/pv_roi_tracker"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
map:
  - share:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
options:
  gross_investment: 51900.0
  subsidy: 28714.0
  system_kwp: 6.72
  poll_interval_minutes: 30
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
  backup_share: "/share/pv_roi_tracker"
  discount_rate_real: 0.04
  inflation_rate_assumption: 0.05
  comparison_yield_rate: 0.055
  battery_roundtrip_efficiency: 0.92
  monthly_notify: true
  co2_factor_kg_kwh: 0.597
  deposit_refund_pct: 0.20
  timezone: "Europe/Warsaw"
schema:
  gross_investment: float
  subsidy: float
  system_kwp: float
  poll_interval_minutes: int
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  log_level: "list(debug|info|warning|error)?"
  backup_share: str
  discount_rate_real: float
  inflation_rate_assumption: float
  comparison_yield_rate: float
  battery_roundtrip_efficiency: float
  monthly_notify: bool
  co2_factor_kg_kwh: float
  deposit_refund_pct: float
  timezone: str?
