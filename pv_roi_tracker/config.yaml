name: PV ROI Tracker
version: "0.2.0"
slug: pv_roi_tracker
description: >-
  Tracks the ROI of a residential PV solar system.
  Imports historic data once from Google Sheets, then uses live HA sensors
  for ongoing monthly tracking. Publishes ROI sensors via MQTT discovery.
url: ""
arch:
  - aarch64
  - amd64
  - armv7
init: false
options:
  csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_3gmj8s_2JPJzPijb9T27oh0FS3JhlQ3cB1HkKPbBa2yi8GyudqJb5ZeyM20QQ9IKbfB3SnbKZukC/pub?output=csv"
  force_reimport: false
  gross_investment: 51900.0
  subsidy: 28714.0
  system_kwp: 6.72
  poll_interval_minutes: 30
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
schema:
  csv_url: str
  force_reimport: bool
  gross_investment: float
  subsidy: float
  system_kwp: float
  poll_interval_minutes: int
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  log_level: "list(debug|info|warning|error)?"
